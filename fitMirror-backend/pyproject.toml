[project]
name = "fitmirror-backend"
version = "0.1.0"
description = "fitMirror API — AI virtual try-on customer service & ops visual generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fitMirror Contributors" }]
keywords = ["fastapi", "langgraph", "virtual-try-on", "rag", "e-commerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "redis>=5.0",
    "prometheus-client>=0.20.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pymilvus>=2.4.0",
    "langchain-openai>=0.2.0",
    "langchain-milvus>=0.1.0",
    "chromadb>=0.5.0",
    "aiofiles>=24.0.0",
    "pillow>=10.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.15.0",
    "python-docx>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
